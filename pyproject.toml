[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team17-hotel-compiler"
version = "0.1.0"
description = "A deterministic compiler-style hotel review analyzer"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
research = ["vaderSentiment==3.3.2", "textblob==0.19.0", "nltk==3.10.3", "matplotlib>=3.9,<4"]

[project.scripts]
hotel-compiler = "hotel_compiler.cli:main"
hotel-compiler-web = "hotel_compiler.web:main"
hotel-compiler-batch = "hotel_compiler.batch_cli:main"
hotel-compiler-evaluate = "hotel_compiler.evaluation:main"
hotel-compiler-research = "hotel_compiler.research_cli:main"
hotel-compiler-neural = "hotel_compiler.neural_cli:main"
hotel-compiler-routed = "hotel_compiler.routed_cli:main"

[tool.setuptools.packages.find]
include = ["hotel_compiler*"]

[tool.setuptools.package-data]
hotel_compiler = ["resources/*", "web_assets/*"]

